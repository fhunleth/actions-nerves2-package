name: deploy-package
description: Release Nerves 2 package archives and optionally publish to Hex

inputs:
  github-token:
    description: |
      GitHub token for creating releases. GITHUB_TOKEN is set for every action
      and can be passed as an input to this action. You will also need to set
      the `contents: write` permission for the token.

      See docs for more info:
      * https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/using-github-cli-in-workflows
      * https://docs.github.com/en/actions/writing-workflows/choosing-what-your-workflow-does/controlling-permissions-for-github_token 
    required: true
  publish-to-hex:
    description: Publish the GitHub release, then publish the package and docs to Hex
    required: false
    default: 'false'
  otp-version:
    description: OTP version (27 or later); required when publish-to-hex is true
    required: false
  elixir-version:
    description: Elixir version; required when publish-to-hex is true
    required: false
  nerves-bootstrap-version:
    description: nerves_bootstrap version; required when publish-to-hex is true
    required: false

runs:
  using: composite
  steps:
    - name: Validate Hex publishing configuration
      if: inputs.publish-to-hex == 'true'
      shell: bash
      env:
        OTP_VERSION: ${{ inputs.otp-version }}
        ELIXIR_VERSION: ${{ inputs.elixir-version }}
        NERVES_BOOTSTRAP_VERSION: ${{ inputs.nerves-bootstrap-version }}
      run: |
        if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then
          echo "::error::Hex publishing requires a tagged release"
          exit 1
        fi
        if [[ -z "$OTP_VERSION" || -z "$ELIXIR_VERSION" || -z "$NERVES_BOOTSTRAP_VERSION" ]]; then
          echo "::error::Hex publishing requires otp-version, elixir-version, and nerves-bootstrap-version"
          exit 1
        fi
    - name: Restore cache
      uses: actions/cache/restore@v6
      with:
        path: deploy/system
        key: nerves2-deploy-package-${{ github.run_id }}
        fail-on-cache-miss: true
    - name: Create release notes
      shell: bash
      run: |
        export REF_NAME=$(echo "${{ github.ref_name }}" | sed 's,[\\\^\$\.\|\?\*\+\(\)\[\]]*,\\\0,g')
        grep -Pazo "(?s)(?<=## ${REF_NAME})[^#]+" deploy/system/CHANGELOG.md | sed '/./,$!d' | tr -d '\0' > deploy/system/RELEASE_NOTES
        echo "$(< deploy/system/RELEASE_NOTES)"
    - name: Deploy artifacts to Github
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
        RELEASE_TAG: ${{ github.ref_name }}
      run: |
        gh release create "$RELEASE_TAG" deploy/system/artifacts/* deploy/system/checksum.exs --title "$RELEASE_TAG" -F deploy/system/RELEASE_NOTES --draft
    - uses: ./.actions/.internal/setup-beam-nerves
      if: inputs.publish-to-hex == 'true'
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}
        nerves-bootstrap-version: ${{ inputs.nerves-bootstrap-version }}
    - name: Publish to Hex
      if: inputs.publish-to-hex == 'true'
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github-token }}
      run: |
        bash "${GITHUB_ACTION_PATH}/publish.sh"
