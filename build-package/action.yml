name: build-package
description: Build a Nerves 2 package and prepare its archives and Hex package

inputs:
  otp-version:
    required: true
    description: Set OTP version to use
  elixir-version:
    required: true
    description: Set Elixir version to use
  nerves-bootstrap-version:
    required: true
    description: Set nerves_bootstrap version to use
  hex-validate:
    required: false
    description: Validate and save the Hex package after generating checksums
    default: 'true'

runs:
  using: composite
  steps:
    - uses: ./.actions/.internal/setup-beam-nerves
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}
        nerves-bootstrap-version: ${{ inputs.nerves-bootstrap-version }}
    - uses: ./.actions/.internal/restore-nerves-downloads
    - uses: ./.actions/.internal/mix-deps-get
    - name: Build
      shell: bash
      env:
        NERVES_CONTAINER_TOOL: docker
      run: script -e -c 'mix nerves.artifact.build' -q /dev/null
    - name: Generate artifact checksums
      shell: bash
      run: mix nerves.artifact.checksum
    - name: Stage artifacts
      shell: bash
      run: |
        elixir -r "${GITHUB_ACTION_PATH}/stage_artifacts.exs" -S mix nerves.action.stage
    - name: Validate and save Hex package
      if: inputs.hex-validate == 'true'
      shell: bash
      run: |
        mkdir -p deploy/system/hex
        mix hex.build --output deploy/system/hex/package.tar
    - name: Store artifacts
      uses: actions/upload-artifact@v7
      with:
        path: deploy/system
        name: system
        if-no-files-found: error
    - name: Save deploy cache
      uses: actions/cache/save@v6
      with:
        path: deploy/system
        key: nerves2-deploy-package-${{ github.run_id }}
