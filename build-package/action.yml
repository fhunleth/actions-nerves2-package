name: build-package
description: Build a Nerves 2 package and prepare its archives and Hex package

inputs:
  otp-version:
    required: true
    description: Set OTP version to use
  elixir-version:
    required: true
    description: Set Elixir version to use
  nerves-bootstrap-version:
    required: true
    description: Set nerves_bootstrap version to use
  hex-validate:
    required: false
    description: Validate and save the Hex package after generating checksums
    default: 'true'
  enable-ccache:
    required: false
    description: Persist compiler cache (requires Nerves with NERVES_CCACHE_DIR support)
    default: 'false'
  ccache-initial-setup:
    required: false
    description: Initial ccache options for Buildroot packages
    default: '--max-size=1G'

runs:
  using: composite
  steps:
    - uses: ./.actions/.internal/setup-beam-nerves
      with:
        otp-version: ${{ inputs.otp-version }}
        elixir-version: ${{ inputs.elixir-version }}
        nerves-bootstrap-version: ${{ inputs.nerves-bootstrap-version }}
    - uses: ./.actions/.internal/restore-nerves-downloads
    - uses: ./.actions/.internal/mix-deps-get
    - name: Restore compiler cache
      if: inputs.enable-ccache == 'true'
      uses: actions/cache/restore@v6
      with:
        path: ${{ runner.temp }}/nerves-ccache
        key: nerves2-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-${{ hashFiles('mix.lock', 'nerves_defconfig') }}-${{ github.run_id }}-${{ github.run_attempt }}
        restore-keys: |
          nerves2-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-${{ hashFiles('mix.lock', 'nerves_defconfig') }}-
    - name: Build
      shell: bash
      env:
        NERVES_CONTAINER_TOOL: docker
        ENABLE_CCACHE: ${{ inputs.enable-ccache }}
        CCACHE_INITIAL_SETUP: ${{ inputs.ccache-initial-setup }}
      run: |
        if [[ "$ENABLE_CCACHE" == "true" ]]; then
          export NERVES_CCACHE_DIR="${RUNNER_TEMP}/nerves-ccache"
          export NERVES_CCACHE_INITIAL_SETUP="$CCACHE_INITIAL_SETUP"
        fi
        bash "${GITHUB_ACTION_PATH}/run_logged.sh" artifact-build \
          script -e -c 'mix nerves.artifact.build' -q /dev/null
    - name: Generate artifact checksums
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/run_logged.sh" artifact-checksum \
          mix nerves.artifact.checksum
    - name: Stage artifacts
      shell: bash
      run: |
        bash "${GITHUB_ACTION_PATH}/run_logged.sh" artifact-staging \
          elixir -r "${GITHUB_ACTION_PATH}/stage_artifacts.exs" -S mix nerves.action.stage
    - name: Validate and save Hex package
      if: inputs.hex-validate == 'true'
      shell: bash
      run: |
        mkdir -p deploy/system/hex
        bash "${GITHUB_ACTION_PATH}/run_logged.sh" hex-build \
          mix hex.build --output deploy/system/hex/package.tar
    - name: Store artifacts
      uses: actions/upload-artifact@v7
      with:
        path: deploy/system
        name: system
        if-no-files-found: error
    - name: Save deploy cache
      uses: actions/cache/save@v6
      with:
        path: deploy/system
        key: nerves2-deploy-package-${{ github.run_id }}
    - name: Upload command logs
      if: always()
      uses: actions/upload-artifact@v7
      with:
        path: ${{ runner.temp }}/nerves-package-logs
        name: nerves-package-logs
        if-no-files-found: ignore
    - name: Save compiler cache
      if: success() && inputs.enable-ccache == 'true'
      uses: actions/cache/save@v6
      with:
        path: ${{ runner.temp }}/nerves-ccache
        key: nerves2-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.repository_id }}-${{ hashFiles('mix.lock', 'nerves_defconfig') }}-${{ github.run_id }}-${{ github.run_attempt }}
